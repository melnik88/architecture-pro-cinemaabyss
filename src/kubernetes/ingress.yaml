apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Root path routes to proxy service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8083
          # Health check for proxy service
          - path: /health
            pathType: Exact
            backend:
              service:
                name: proxy-service
                port:
                  number: 8083
          # API routes through proxy service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8083
          # Direct access to events service for testing
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082
